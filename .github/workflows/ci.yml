name: CI

# Every platform the agent ships for: each module's tests on its own OS and architecture, the
# agent installed for real (install, this release's features, an update's merge step, uninstall),
# and its container deploys (Docker Compose, the Helm chart on kind). Runs on every push and pull
# request, and before every release (release.yml calls it), so a release can't ship a platform
# that doesn't work.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-amd64, os: windows-latest }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-amd64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dist/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test every module
        shell: bash
        run: |
          set -e
          for mod in diskusagereceiver netusagereceiver dockerlogsreceiver logrules zharpexporter zharplogsprocessor dist; do
            echo "::group::$mod"
            (cd "$mod" && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

  install:
    name: Install ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-amd64, os: windows-latest }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-amd64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dist/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          (cd dist && go build -ldflags="-X main.version=v0.0.0-ci" -o "../zharp-collector$ext" .)
      - name: Install, check, update, uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        run: bash .github/scripts/smoke.sh
      - name: Install, check, update, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/smoke.ps1

  containers:
    name: Containers (Docker Compose, Kubernetes)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dist/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Build the image
        env:
          CGO_ENABLED: "0"
        run: |
          (cd dist && go build -ldflags="-X main.version=v0.0.0-ci" -o ../zharp-collector-linux-amd64 .)
          docker build -t zharp-agent:ci .
      - name: Install kind
        run: |
          # From GitHub's release, retried: kind's own site has answered 504s.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind
      - name: Deploy and check what arrives
        run: bash .github/scripts/containers.sh zharp-agent:ci
