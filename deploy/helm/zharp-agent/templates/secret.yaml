{{- if and .Values.apiKey (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zharp-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zharp-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.existingSecretKey }}: {{ .Values.apiKey | b64enc | quote }}
{{- end }}
