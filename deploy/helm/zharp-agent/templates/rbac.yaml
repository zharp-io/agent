{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zharp-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zharp-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Read-only: the pods on the node and their owners (for workload names and annotations), and
# the kubelet's stats API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zharp-agent.fullname" . }}
  labels:
    {{- include "zharp-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy, nodes/metrics]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zharp-agent.fullname" . }}
  labels:
    {{- include "zharp-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "zharp-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zharp-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
