{{- $fullname := include "zharp-agent.fullname" . -}}
{{- $metrics := and .Values.metrics.enabled (or .Values.metrics.kubelet .Values.metrics.host) -}}
{{- $node := and .Values.metrics.enabled .Values.metrics.host -}}
{{- $whatsUsing := list -}}
{{- if and $node .Values.metrics.programs }}{{ $whatsUsing = append $whatsUsing "hostmetrics/processes" }}{{ end -}}
{{- if and $node .Values.metrics.diskUsage }}{{ $whatsUsing = append $whatsUsing "zharp_disk_usage" }}{{ end -}}
{{- if and $node .Values.metrics.networkByProgram .Values.hostNetwork }}{{ $whatsUsing = append $whatsUsing "zharp_network_usage" }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zharp-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Remembers how far each log file was read, across restarts.
      file_storage:
        directory: /var/lib/zharp-agent/storage
        create_directory: true

    receivers:
      {{- if .Values.logs.enabled }}
      # Every container's stdout and stderr on this node.
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # The agent's own output.
          - /var/log/pods/{{ .Release.Namespace }}_{{ $fullname }}-*_*/*/*.log
          {{- range .Values.logs.excludeNamespaces }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        start_at: end
        include_file_path: true
        include_file_name: false
        storage: file_storage
        retry_on_failure:
          enabled: true
        operators:
          # containerd/CRI-O ("<time> stdout F <line>") and Docker JSON lines; joins lines the
          # runtime split, and names the pod, namespace and container from the file path.
          - type: container
            id: container-parser
            add_metadata_from_filepath: true
      {{- end }}
      {{- if and .Values.metrics.enabled .Values.metrics.kubelet }}
      kubeletstats:
        collection_interval: {{ .Values.metrics.collectionInterval }}
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: {{ .Values.metrics.kubeletInsecureSkipVerify }}
        metric_groups: [node, pod, container]
        # container.id on container metrics, so Zharp tells containers apart across restarts.
        extra_metadata_labels: [container.id]
      {{- end }}
      {{- if and .Values.metrics.enabled .Values.metrics.host }}
      hostmetrics:
        root_path: /hostfs
        collection_interval: {{ .Values.metrics.collectionInterval }}
        scrapers:
          cpu:
            metrics:
              system.cpu.time:
                enabled: false
              system.cpu.utilization:
                enabled: true
              system.cpu.logical.count:
                enabled: true
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
              system.memory.limit:
                enabled: true
          load:
          network:
            metrics:
              system.network.connections:
                enabled: false
              system.network.packets:
                enabled: false
              system.network.dropped:
                enabled: false
              system.network.errors:
                enabled: false
          filesystem:
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tmpfs, tracefs]
              match_type: strict
            exclude_mount_points:
              mount_points: ['^/(dev|proc|sys|run|snap|var/lib/(kubelet|containerd|docker))(/|\z)']
              match_type: regexp
            metrics:
              system.filesystem.inodes.usage:
                enabled: false
          system:
      {{- end }}
      {{- if has "hostmetrics/processes" $whatsUsing }}
      # Each program's CPU and memory on the node, every 30s. Processes in pods are counted with
      # their containers; Zharp keeps the node's own programs (kubelet, containerd, ...).
      hostmetrics/processes:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          process:
            # The agent itself runs in a pod and is counted there; inside its own cgroup
            # namespace it would look like one of the node's programs.
            exclude:
              names: [zharp-collector]
              match_type: strict
            mute_process_name_error: true
            mute_process_exe_error: true
            mute_process_io_error: true
            mute_process_user_error: true
            mute_process_cgroup_error: true
            metrics:
              process.cpu.time:
                enabled: false
              process.cpu.utilization:
                enabled: true
              process.memory.usage:
                enabled: true
              process.memory.virtual:
                enabled: false
              process.disk.io:
                enabled: false
            resource_attributes:
              process.cgroup:
                enabled: true
              process.command:
                enabled: false
              process.executable.path:
                enabled: false
              process.parent_pid:
                enabled: false
      {{- end }}
      {{- if has "zharp_disk_usage" $whatsUsing }}
      # Each of the node's drives: its biggest folders and files, hourly, at idle priority.
      zharp_disk_usage:
        collection_interval: 1h
        root_path: /hostfs
      {{- end }}
      {{- if has "zharp_network_usage" $whatsUsing }}
      # Each program's TCP traffic and peers on the node, every minute.
      zharp_network_usage:
        collection_interval: 1m
        root_path: /hostfs
      {{- end }}
      {{- if .Values.traces.enabled }}
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- end }}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Pod, namespace, node and workload names, and the zharp.io/* annotations and
      # app.kubernetes.io labels the zharp_logs processor reads.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
          annotations:
            - key_regex: zharp\.io/.*
              from: pod
          labels:
            - key: app.kubernetes.io/name
              from: pod
            - key: app.kubernetes.io/version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      # Service, environment, version and source from the zharp.io/* annotations; opt-out;
      # multi-line joining; exclude and mask rules (the pod's, then these); built-in masks.
      zharp_logs:
        default_masks: {{ .Values.rules.defaultMasks }}
        {{- with .Values.rules.disableDefaultMasks }}
        disable_default_masks: [{{ join ", " . }}]
        {{- end }}
        {{- with .Values.environment }}
        environment: {{ include "zharp-agent.configString" . }}
        {{- end }}
        kubernetes:
          enabled: true
          multiline: {{ include "zharp-agent.configString" .Values.logs.multiline }}
        {{- if or .Values.rules.exclude .Values.rules.mask }}
        rules:
          {{- range .Values.rules.exclude }}
          - type: exclude
            pattern: {{ include "zharp-agent.configString" . }}
          {{- end }}
          {{- range .Values.rules.mask }}
          - type: mask
            pattern: {{ include "zharp-agent.configString" .pattern }}
            {{- with .replace }}
            replace: {{ include "zharp-agent.configString" . }}
            {{- end }}
          {{- end }}
        {{- else }}
        rules: []
        {{- end }}
      {{- if has "hostmetrics/processes" $whatsUsing }}
      # A command line keeps the program and its first two arguments ("node /app/main.js",
      # "java -jar app.jar"); the rest can hold passwords and tokens and is dropped here.
      transform/processes:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - 'replace_pattern(attributes["process.command_line"], "^(\"[^\"]*\"|[^ ]+)( +(\"[^\"]*\"|[^ ]+))?( +(\"[^\"]*\"|[^ ]+))?.*$$", "$$1$$2$$4")'
      {{- end }}
      # host.name (the node) and k8s.cluster.name, from OTEL_RESOURCE_ATTRIBUTES.
      resourcedetection:
        detectors: [env]
        timeout: 5s
        override: false
      # The node on host and container metrics: host.name and k8s.cluster.name from
      # OTEL_RESOURCE_ATTRIBUTES (with zharp.agent.version, which the binary adds), the OS
      # from the system detector.
      resourcedetection/host:
        detectors: [env, system]
        timeout: 5s
        system:
          resource_attributes:
            os.name:
              enabled: true
            os.version:
              enabled: true
            os.description:
              enabled: true
            host.arch:
              enabled: true
      {{- if .Values.traces.enabled }}
      # The node (host.name) and cluster on what applications send over OTLP. override: false
      # keeps what the application set itself — its service.name above all.
      resourcedetection/otlp:
        detectors: [env]
        timeout: 5s
        override: false
      {{- end }}
      batch:
        send_batch_size: 1000
        timeout: 5s

    exporters:
      zharp:
        api_key: ${env:ZHARP_API_KEY}
        {{- with .Values.endpoint }}
        endpoint: {{ . | quote }}
        {{- end }}
      {{- if or $metrics .Values.traces.enabled }}
      # Node and container metrics, and applications' OTLP traces and logs, to Zharp's OTLP
      # ingest (<endpoint>/otlp) with the same key; gzipped, queued and retried.
      otlp_http/zharp:
        endpoint: {{ printf "%s/otlp" (trimSuffix "/" (default "https://api.zharp.io/api/v1" .Values.endpoint)) | quote }}
        headers:
          Authorization: "Bearer ${env:ZHARP_API_KEY}"
        compression: gzip
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
      {{- end }}

    service:
      extensions: [health_check, file_storage]
      pipelines:
        {{- if .Values.logs.enabled }}
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection, batch]
          exporters: [zharp]
        {{- end }}
        {{- if $metrics }}
        # Node and container metrics (Servers & Containers), as OTLP. zharp is there for its
        # heartbeat; it doesn't send these.
        metrics/host:
          receivers: [{{ $r := list }}{{ if and .Values.metrics.enabled .Values.metrics.kubelet }}{{ $r = append $r "kubeletstats" }}{{ end }}{{ if and .Values.metrics.enabled .Values.metrics.host }}{{ $r = append $r "hostmetrics" }}{{ end }}{{ join ", " $r }}]
          processors: [memory_limiter, resourcedetection/host, batch]
          exporters: [otlp_http/zharp, zharp]
        {{- end }}
        {{- if $whatsUsing }}
        # What's using the node: programs' CPU, memory and traffic, and drives' biggest folders.
        metrics/processes:
          receivers: [{{ join ", " $whatsUsing }}]
          processors: [memory_limiter, resourcedetection/host{{ if has "hostmetrics/processes" $whatsUsing }}, transform/processes{{ end }}, batch]
          exporters: [otlp_http/zharp]
        {{- end }}
        {{- if .Values.traces.enabled }}
        # Applications' own OpenTelemetry metrics.
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection, batch]
          exporters: [zharp]
        {{- end }}
        {{- if .Values.traces.enabled }}
        # Applications' OpenTelemetry, sent on as OTLP (Application Monitoring), tagged with
        # the pod, workload and zharp.io/* annotations on the way.
        traces/otlp:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection/otlp, batch]
          exporters: [otlp_http/zharp]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection/otlp, batch]
          exporters: [otlp_http/zharp]
        {{- end }}
