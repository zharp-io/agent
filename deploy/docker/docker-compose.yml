# Zharp Collector — Docker Compose
#
# Setup:
#   cp .env.example .env
#   nano .env          # paste your API key
#   docker compose up -d
#
# The collector will automatically tail logs from every container on this host
# and collect host + per-container metrics — no per-service config needed.
#
# It shares the host's network (network_mode: host), so it listens on the host's own ports.
# Apps using the OpenTelemetry SDK push to the host's address:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<host IP>:4317 (gRPC) or :4318 (HTTP)
# From another container on this host, use http://host.docker.internal:4317 with
#   extra_hosts: ["host.docker.internal:host-gateway"]

services:
  zharp-collector:
    image: ghcr.io/zharp-io/agent:latest
    container_name: zharp-collector
    restart: unless-stopped
    # The Docker socket is root-only.
    user: "0:0"
    environment:
      ZHARP_API_KEY: ${ZHARP_API_KEY}
      # The host's operating system, not the agent image's: OS detection reads the host's /etc.
      HOST_ETC: /hostfs/etc
    volumes:
      - ./collector-config.yaml:/etc/zharp-collector/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      # The host's users, so programs and files are owned by names, not numbers.
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # Where each container's log was read up to, across restarts.
      - zharp-state:/var/lib/zharp-collector
    # The host's network: its connection table, for each program's traffic (network by
    # program), and the host's own ports 4317, 4318 and 13133 for applications and health.
    network_mode: host
    # The host's processes (read through /hostfs/proc as well), and their cgroups as the host
    # sees them, so a process in a container is counted with its container, not as a program.
    pid: host
    cgroup: host
    # Read-only: SYS_PTRACE sees which process holds each network connection.
    cap_add:
      - SYS_PTRACE
    healthcheck:
      # The image has no shell; the binary checks its own health endpoint.
      test: ["CMD", "/zharp-collector", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zharp-state:
