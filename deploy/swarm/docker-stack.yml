# Zharp Collector — Docker Swarm Stack
# Runs one collector per Swarm node (global mode) — logs from every container
# on every node are collected automatically with no per-service config.
#
# Setup:
#   # Store the collector config as a Swarm config object (once per swarm)
#   docker config create zharp_collector_config ./collector-config.yaml
#
#   # Deploy (set your API key in the environment before running)
#   ZHARP_API_KEY=your_api_key docker stack deploy -c docker-stack.yml zharp
#
# To update the config:
#   docker config rm zharp_collector_config
#   docker config create zharp_collector_config ./collector-config.yaml
#   docker service update --force zharp_collector

version: "3.9"

services:
  collector:
    image: ghcr.io/zharp-io/agent:latest
    # The Docker socket is root-only.
    user: "0:0"
    deploy:
      mode: global          # exactly one container per node
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    environment:
      ZHARP_API_KEY: ${ZHARP_API_KEY}
    configs:
      - source: zharp_collector_config
        target: /etc/zharp-collector/config.yaml
        mode: 0444
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      # The node's users, so programs and files are owned by names, not numbers.
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - zharp-state:/var/lib/zharp-collector
    # Read-only: SYS_PTRACE sees which process holds each network connection.
    cap_add:
      - SYS_PTRACE
    # The node's network: its connection table, for each program's traffic, and the node's own
    # ports 4317, 4318 and 13133 (apps on the same node send OTLP to localhost:4317).
    networks:
      - hostnet

networks:
  hostnet:
    external: true
    name: host

volumes:
  zharp-state:

configs:
  zharp_collector_config:
    external: true
