# Zharp Collector — Docker Swarm Stack
# Runs one collector per Swarm node (global mode) — logs from every container
# on every node are collected automatically with no per-service config.
#
# Setup:
#   # Store the collector config as a Swarm config object (once per swarm)
#   docker config create zharp_collector_config ./collector-config.yaml
#
#   # Deploy (set your API key in the environment before running)
#   ZHARP_API_KEY=your_api_key docker stack deploy -c docker-stack.yml zharp
#
# To update the config:
#   docker config rm zharp_collector_config
#   docker config create zharp_collector_config ./collector-config.yaml
#   docker service update --force zharp_collector
#
# Each program's network traffic (network by program) needs the node's network, which a stack
# can't give a service (Docker refuses the host network in stack files). deploy.sh, next to this
# file, creates the same service with it; everything else works the same either way.

version: "3.9"

services:
  collector:
    image: ghcr.io/zharp-io/agent:latest
    # The Docker socket is root-only.
    user: "0:0"
    # The node's name, so the server is named after it, not after this container.
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global          # exactly one container per node
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    environment:
      ZHARP_API_KEY: ${ZHARP_API_KEY}
      # The node's operating system, not the agent image's: OS detection reads the node's /etc.
      HOST_ETC: /hostfs/etc
    configs:
      - source: zharp_collector_config
        target: /etc/zharp-collector/config.yaml
        mode: 0444
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      # The node's users, so programs and files are owned by names, not numbers.
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - zharp-state:/var/lib/zharp-collector
    # Read-only: SYS_PTRACE sees which process holds each network connection.
    cap_add:
      - SYS_PTRACE
    ports:
      # host mode: port binds on the node directly, not load-balanced across nodes
      # apps on the same node use localhost:4317 to send OTLP
      - target: 4317
        published: 4317
        mode: host
      - target: 4318
        published: 4318
        mode: host
      - target: 13133
        published: 13133
        mode: host

volumes:
  zharp-state:

configs:
  zharp_collector_config:
    external: true
