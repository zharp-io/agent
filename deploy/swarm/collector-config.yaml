## Zharp Collector — Docker Swarm config (identical to deploy/docker/collector-config.yaml)
## Automatically collects logs from all containers on each Swarm node.
## No per-service configuration needed.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Every container's stdout and stderr through the Docker API. Containers are named and tuned
  # with labels: zharp.service, zharp.env, zharp.version, zharp.source, zharp.logs=false (skip),
  # zharp.logs.multiline, zharp.logs.exclude, zharp.logs.mask. Stack traces become one record.
  docker_logs:
    endpoint: unix:///var/run/docker.sock
    state_file: /var/lib/zharp-collector/docker_logs.json

  # Receive traces/metrics/logs from apps that use the OpenTelemetry SDK
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host CPU, memory, filesystems, network, load and uptime
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.time:
            enabled: false
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          system.memory.limit:
            enabled: true
      load:
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ["/dev/.*", "/proc/.*", "/sys/.*", "/run/.*", "/snap/.*", "/var/lib/docker/.*", "/var/lib/kubelet/.*", "/var/lib/containers/.*", "/boot/efi"]
          match_type: regexp
        metrics:
          system.filesystem.inodes.usage:
            enabled: false
      network:
        metrics:
          system.network.connections:
            enabled: false
          system.network.packets:
            enabled: false
          system.network.dropped:
            enabled: false
          system.network.errors:
            enabled: false
      system:

  # Per-container CPU, memory, network (pulled from Docker API)
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s

  # Every container's state, exit code, OOM kill, ports and restarts, stopped ones included
  # (docker_stats only sees running containers).
  docker_state:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

  # What's using the host, outside its containers (Servers & Containers' "What's using it"), read
  # through /hostfs. Each program's CPU and memory, every 30s (processes in containers are counted
  # with their container):
  hostmetrics/processes:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
        mute_process_cgroup_error: true
        metrics:
          process.cpu.time:
            enabled: false
          process.cpu.utilization:
            enabled: true
          process.memory.usage:
            enabled: true
          process.memory.virtual:
            enabled: false
          process.disk.io:
            enabled: false
        resource_attributes:
          process.cgroup:
            enabled: true
          process.command:
            enabled: false
          process.executable.path:
            enabled: false
          process.parent_pid:
            enabled: false
  # Each drive's biggest folders and files, hourly, at idle priority.
  zharp_disk_usage:
    collection_interval: 1h
    root_path: /hostfs
  # Each program's TCP traffic and peers, every minute. Needs the compose file's
  # network_mode: host and SYS_PTRACE.
  zharp_network_usage:
    collection_interval: 1m
    root_path: /hostfs

processors:
  batch:
    send_batch_size: 500
    timeout: 5s
  # A command line keeps the program and its first two arguments ("node /app/main.js",
  # "java -jar app.jar"); the rest can hold passwords and tokens and is dropped here.
  transform/processes:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'replace_pattern(attributes["process.command_line"], "^(\"[^\"]*\"|[^ ]+)( +(\"[^\"]*\"|[^ ]+))?( +(\"[^\"]*\"|[^ ]+))?.*$$", "$$1$$2$$4")'
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s
  resourcedetection:
    detectors: [system, env]
    timeout: 5s
  # Names the server on host and container metrics: the host's own name (the agent shares the
  # host's network, so its hostname is the host's; Docker's own detector can't find the agent's
  # container that way and stops the agent), the OS, addresses and, on a cloud VM, provider and
  # region. env carries zharp.agent.version.
  resourcedetection/host:
    detectors: [env, system, ec2, gcp, azure]
    timeout: 5s
    system:
      resource_attributes:
        os.name:
          enabled: true
        os.version:
          enabled: true
        os.description:
          enabled: true
        host.ip:
          enabled: true
        host.arch:
          enabled: true
  # The Docker host's attributes (host.name, os.type) on what applications send over OTLP.
  # override: false keeps what the application set itself — its service.name above all.
  resourcedetection/otlp:
    detectors: [system]
    timeout: 5s
    override: false

  # Exclude/mask rules for every log record and the built-in masks (card numbers, bearer
  # tokens, JWTs, AWS keys, private keys). Add rules here:
  #   rules:
  #     - {type: exclude, pattern: 'GET /health'}
  #     - {type: mask, pattern: '(password=)\S+', replace: '$${1}***'}
  zharp_logs:
    default_masks: true
    rules: []

exporters:
  zharp:
    api_key: "${env:ZHARP_API_KEY}"
    endpoint: "${env:ZHARP_ENDPOINT:-https://api.zharp.io/api/v1}"
  # Host and container metrics, and applications' OTLP traces and logs, to Zharp's OTLP ingest
  # with the same key. Set ZHARP_ENDPOINT (e.g. https://zharp.example.com/api/v1) for
  # self-hosted Zharp.
  otlp_http/zharp:
    endpoint: "${env:ZHARP_ENDPOINT:-https://api.zharp.io/api/v1}/otlp"
    headers:
      Authorization: "Bearer ${env:ZHARP_API_KEY}"
    compression: gzip
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [docker_logs]
      processors: [memory_limiter, zharp_logs, resourcedetection, batch]
      exporters: [zharp]
    # Host and container metrics (Servers & Containers), as OTLP. zharp is there for its
    # heartbeat; it doesn't send these.
    metrics/host:
      receivers: [hostmetrics, docker_stats, docker_state]
      processors: [memory_limiter, resourcedetection/host, batch]
      exporters: [otlp_http/zharp, zharp]
    # What's using the host: programs' CPU, memory and traffic, and drives' biggest folders.
    metrics/processes:
      receivers: [hostmetrics/processes, zharp_disk_usage, zharp_network_usage]
      processors: [memory_limiter, resourcedetection/host, transform/processes, batch]
      exporters: [otlp_http/zharp]
    # Applications' own OpenTelemetry metrics.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [zharp]
    # OpenTelemetry from applications, sent on as OTLP (Application Monitoring).
    traces/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/otlp, batch]
      exporters: [otlp_http/zharp]
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/otlp, batch]
      exporters: [otlp_http/zharp]
