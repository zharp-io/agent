## Zharp Collector — Docker Swarm config (identical to deploy/docker/collector-config.yaml)
## Automatically collects logs from all containers on each Swarm node.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Every container's stdout and stderr through the Docker API. Containers are named and tuned
  # with labels: zharp.service, zharp.env, zharp.version, zharp.source, zharp.logs=false (skip),
  # zharp.logs.multiline, zharp.logs.exclude, zharp.logs.mask. Stack traces become one record.
  docker_logs:
    endpoint: unix:///var/run/docker.sock
    state_file: /var/lib/zharp-collector/docker_logs.json

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      filesystem:
      load:

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    timeout: 20s

processors:
  batch:
    send_batch_size: 500
    timeout: 5s
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s
  resourcedetection:
    detectors: [system, docker, env]
    timeout: 5s

  # Exclude/mask rules for every log record and the built-in masks (card numbers, bearer
  # tokens, JWTs, AWS keys, private keys). Add rules here:
  #   rules:
  #     - {type: exclude, pattern: 'GET /health'}
  #     - {type: mask, pattern: '(password=)\S+', replace: '$${1}***'}
  zharp_logs:
    default_masks: true
    rules: []

exporters:
  zharp:
    api_key: "${env:ZHARP_API_KEY}"

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [docker_logs, otlp]
      processors: [memory_limiter, zharp_logs, resourcedetection, batch]
      exporters: [zharp]
    metrics:
      receivers: [hostmetrics, docker_stats, otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [zharp]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [zharp]
