  selector:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
