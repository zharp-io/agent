# Read-only: the pods on the node and their owners (for workload names and annotations), and
# the kubelet's stats API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zharp-agent
  labels:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: zharp-agent-0.1.0
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats, nodes/proxy, nodes/metrics]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
