# Source: zharp-agent/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: zharp-agent
  namespace: zharp-system
  labels:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: zharp-agent-0.1.0
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      # Remembers how far each log file was read, across restarts.
      file_storage:
        directory: /var/lib/zharp-agent/storage
        create_directory: true

    receivers:
      # Every container's stdout and stderr on this node.
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          # The agent's own output.
          - /var/log/pods/zharp-system_zharp-agent-*_*/*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        storage: file_storage
        retry_on_failure:
          enabled: true
        operators:
          # containerd/CRI-O ("<time> stdout F <line>") and Docker JSON lines; joins lines the
          # runtime split, and names the pod, namespace and container from the file path.
          - type: container
            id: container-parser
            add_metadata_from_filepath: true
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      hostmetrics:
        root_path: /hostfs
        collection_interval: 30s
        scrapers:
          cpu:
          memory:
          load:
          network:
          disk:
          filesystem:
            exclude_mount_points:
              mount_points: ['^/(dev|proc|sys|run|snap|var/lib/(kubelet|containerd|docker))(/|\z)']
              match_type: regexp
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Pod, namespace, node and workload names, and the zharp.io/* annotations and
      # app.kubernetes.io labels the zharp_logs processor reads.
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
          annotations:
            - key_regex: zharp\.io/.*
              from: pod
          labels:
            - key: app.kubernetes.io/name
              from: pod
            - key: app.kubernetes.io/version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      # Service, environment, version and source from the zharp.io/* annotations; opt-out;
      # multi-line joining; exclude and mask rules (the pod's, then these); built-in masks.
      zharp_logs:
        default_masks: true
        kubernetes:
          enabled: true
          multiline: 'auto'
        rules: []
      # host.name (the node) and k8s.cluster.name, from OTEL_RESOURCE_ATTRIBUTES.
      resourcedetection:
        detectors: [env]
        timeout: 5s
        override: false
      batch:
        send_batch_size: 1000
        timeout: 5s

    exporters:
      zharp:
        api_key: ${env:ZHARP_API_KEY}

    service:
      extensions: [health_check, file_storage]
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection, batch]
          exporters: [zharp]
        metrics:
          receivers: [kubeletstats, hostmetrics, otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, resourcedetection, batch]
          exporters: [zharp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, zharp_logs, batch]
          exporters: [zharp]
