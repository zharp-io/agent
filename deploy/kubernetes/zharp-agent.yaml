# Source: zharp-agent/templates/service.yaml
# OTLP for the cluster's applications. internalTrafficPolicy Local sends each pod's data to the
# agent on its own node, which tags it with that pod.
apiVersion: v1
kind: Service
metadata:
  name: zharp-agent
  namespace: zharp-system
  labels:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: zharp-agent-0.1.0
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
# Source: zharp-agent/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zharp-agent
  namespace: zharp-system
  labels:
    app.kubernetes.io/name: zharp-agent
    app.kubernetes.io/instance: zharp-agent
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: zharp-agent-0.1.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zharp-agent
      app.kubernetes.io/instance: zharp-agent
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zharp-agent
        app.kubernetes.io/instance: zharp-agent
      annotations:
        # Restart the agents when their config changes.
        checksum/config: 59f71e6b562c2b745703c50fc851d83f79b6971701df639e4fcc92811f02b482
        # The agent's own logs are never collected (also excluded by path in the config).
        zharp.io/logs: "false"
    spec:
      serviceAccountName: zharp-agent
      # The node's network: its connection table, for network by program.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: "ghcr.io/zharp-io/agent:latest"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/zharp-agent/config.yaml
          env:
            - name: ZHARP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zharp-agent
                  key: api-key
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # host.name is the node, and the cluster name goes on everything sent.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "host.name=$(K8S_NODE_NAME)"
          ports:
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - DAC_READ_SEARCH
              - SYS_PTRACE
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/zharp-agent
              readOnly: true
            - name: state
              mountPath: /var/lib/zharp-agent
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # On Docker-runtime nodes the files under /var/log/pods link here.
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
            # The node's users, so programs and files are owned by names, not numbers.
            - name: passwd
              mountPath: /etc/passwd
              readOnly: true
            - name: group
              mountPath: /etc/group
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zharp-agent
        - name: state
          hostPath:
            path: /var/lib/zharp-agent
            type: DirectoryOrCreate
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: hostfs
          hostPath:
            path: /
        - name: passwd
          hostPath:
            path: /etc/passwd
            type: File
        - name: group
          hostPath:
            path: /etc/group
            type: File
