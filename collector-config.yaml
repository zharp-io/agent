## Zharp Collector — starter config template
## Run the guided installer to auto-generate this for your server:
##   curl -sSL https://raw.githubusercontent.com/zharp-io/agent/main/install.sh | sudo bash
##
## Or edit manually. Full reference:
##   https://github.com/zharp-io/agent#configuration
##
## Environment: ZHARP_API_KEY (required); ZHARP_ENDPOINT for self-hosted Zharp
## (e.g. http://localhost:3000/api/v1), Zharp Cloud when unset.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Host metrics — always recommended
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      load:

  # OpenTelemetry from applications on this host (traces and logs) — point an SDK's
  # OTEL_EXPORTER_OTLP_ENDPOINT at http://127.0.0.1:4318 (or 127.0.0.1:4317 for gRPC); no API key
  # needed in the app. Bound to localhost: a trace carries request URLs, query text and error
  # messages, so opening this to the network should be a deliberate choice.
  # To turn it off, remove this receiver and the traces/otlp and logs/otlp pipelines below.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  # Tail log files — add your own paths here
  # filelog:
  #   include:
  #     - /var/log/nginx/access.log
  #     - /var/log/myapp/*.log
  #   include_file_path: true

processors:
  batch:
    send_batch_size: 500
    timeout: 5s
  memory_limiter:
    limit_mib: 128
    spike_limit_mib: 32
    check_interval: 5s
  resourcedetection:
    detectors: [system, env]
    timeout: 5s
  # The host's attributes (host.name, os.type) on what applications send. override: false keeps
  # what the application set itself — its service.name above all.
  resourcedetection/otlp:
    detectors: [system]
    timeout: 5s
    override: false

exporters:
  zharp:
    api_key: "${env:ZHARP_API_KEY}"
    endpoint: "${env:ZHARP_ENDPOINT:-https://api.zharp.io/api/v1}"
  # Applications' traces and logs, forwarded unchanged to Zharp's OTLP ingest (<API>/otlp) with
  # the same key. Batches are gzipped, queued and retried while Zharp is unreachable.
  otlp_http/zharp:
    endpoint: "${env:ZHARP_ENDPOINT:-https://api.zharp.io/api/v1}/otlp"
    headers:
      Authorization: "Bearer ${env:ZHARP_API_KEY}"
    compression: gzip
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [zharp]
    # Uncomment when you add filelog above:
    # logs:
    #   receivers: [filelog]
    #   processors: [memory_limiter, resourcedetection, batch]
    #   exporters: [zharp]
    traces/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/otlp, batch]
      exporters: [otlp_http/zharp]
    logs/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/otlp, batch]
      exporters: [otlp_http/zharp]
